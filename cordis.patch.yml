# dsh-jenkins-panel 挂载层（docs/architecture.md §7）
# 向 profile 组合配置 insert 一个插件行；行按包名 'dsh-jenkins-panel' 引用（经 profile 的 pnpm 链接解析）。
# config 留空 {}：全部字段走 Config schema 默认值（defaultConnection/connections/panel/registry），
# token 不入 Config（凭据走 ctx.credentials credential-ref，见 architecture §2.1/§6）。
- insert:
    - id: jenkins
      name: 'dsh-jenkins-panel'
      config: {}
